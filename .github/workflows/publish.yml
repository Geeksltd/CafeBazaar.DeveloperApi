name: Publishes a new version of CafeBazaar.DeveloperApi on the nuget.org
on:
  push:
    branches: [ main ]
jobs:
  build:
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        configuration: [ Release ]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Install Zebble's CLI tools
      run: dotnet tool install --global zebble-build

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish a new CafeBazaar.DeveloperApi package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-1.outputs.NUGET_API_KEY }} --publish